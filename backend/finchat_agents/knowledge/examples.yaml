    question: How many distinct Fynapse journals were posted in Sep 26?
    tables: [silver.fact_fynapse_slr_journals]
    expected: {numbers: ["205"]}
    verified: true
    sql: |
      SELECT COUNT(DISTINCT JOURNAL_ID) AS journals
      FROM lakehouse_mvpai.silver.fact_fynapse_slr_journals
      WHERE FISCAL_YEAR = 2026 AND PERIOD = 9

