  - id: adra_who_approved
    question: Who approved account 213130 for Cars USA Shipping in Oct 26, and on what date?
    tables: [silver.adra_account_facts, silver.adra_account_dimensions, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {text: "Not approved yet: APPROVED_DATE is NULL (status Not prepared); names are masked without PII permission"}
    verified: false
    notes: Actual approver = APPROVED_BY_NAME + APPROVED_DATE. NULL APPROVED_DATE means nobody has approved it.
    sql: |
      SELECT trim(a.ACCOUNT_NUMBER) AS account_number, trim(f.ACCOUNT_STATUS) AS account_status,
             f.APPROVED_BY_NAME, TRY_CAST(f.APPROVED_DATE AS TIMESTAMP) AS approved_date, f.APPROVER_NAME
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_account_dimensions a
        ON f.ACCOUNT_KEY = a.ACCOUNT_KEY AND f.ENGAGEMENT_KEY = a.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = a.LEGAL_ENTITY_KEY
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE lower(le.ENTITY_NAME) LIKE '%cars usa shipping%' AND trim(p.PERIOD_NAME) = 'Oct 26'
        AND trim(a.ACCOUNT_NUMBER) = '213130'

  - id: adra_latest_period
    question: What is the latest period with reconciliation data for Cars USA Shipping?
    tables: [silver.adra_account_facts, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {text: "Oct 26"}
    verified: false
    sql: |
      SELECT trim(p.PERIOD_NAME) AS period_name, TRY_CAST(p.PERIOD_END AS DATE) AS period_end, COUNT(*) AS accounts
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE lower(le.ENTITY_NAME) LIKE '%cars usa shipping%'
      GROUP BY trim(p.PERIOD_NAME), TRY_CAST(p.PERIOD_END AS DATE)
      ORDER BY period_end DESC
      LIMIT 1

