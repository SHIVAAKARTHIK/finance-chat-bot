  # ================================================================ Fynapse (subledger)
  - id: fynapse_source_system_concentration
    question: How concentrated is the journal integration workload across source systems, and does the subledger remain balanced?
    tables: [silver.fact_fynapse_slr_journals]
    expected: {numbers: ["817", "433", "214", "170", "53.0", "26.2", "20.8", "-0.08"]}
    verified: true
    sql: |
      SELECT SOURCE_SYSTEM, COUNT(*) AS journal_lines,
             ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct,
             SUM(REPORTING_AMOUNT) AS net_reporting_amount
      FROM lakehouse_mvpai.silver.fact_fynapse_slr_journals
      GROUP BY SOURCE_SYSTEM
      ORDER BY journal_lines DESC

  - id: fynapse_lines_by_period
    question: Show Fynapse journal line counts and net reporting amount by period.
    tables: [silver.fact_fynapse_slr_journals]
    expected: {numbers: ["207", "610", "-0.02", "-0.06"]}
    verified: true
    sql: |
      SELECT FISCAL_YEAR, PERIOD, MIN(CORE_DATE) AS period_date, COUNT(*) AS journal_lines,
             SUM(REPORTING_AMOUNT) AS net_reporting_amount
      FROM lakehouse_mvpai.silver.fact_fynapse_slr_journals
      GROUP BY FISCAL_YEAR, PERIOD
      ORDER BY FISCAL_YEAR, PERIOD

  - id: fynapse_journal_types_in_month
    question: Which journal types were posted in Fynapse in Sep 26, and how many lines each?
    tables: [silver.fact_fynapse_slr_journals]
    expected: {numbers: ["610"], text: "PERM"}
    verified: true
    notes: Sep 26 was mapped to FISCAL_YEAR 2026, PERIOD 9 from CORE_DATE first; check the mapping, do not assume it.
    sql: |
      SELECT JOURNAL_TYPE, COUNT(*) AS journal_lines
      FROM lakehouse_mvpai.silver.fact_fynapse_slr_journals
      WHERE FISCAL_YEAR = 2026 AND PERIOD = 9
      GROUP BY JOURNAL_TYPE
      ORDER BY journal_lines DESC

