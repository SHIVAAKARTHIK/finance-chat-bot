  - id: fynapse_share_by_entity
    question: What share of Fynapse journal lines does each parent entity account for?
    tables: [silver.fact_fynapse_slr_journals]
    expected: {text: "One row per current PARENT_ENTITY value with its share in percent"}
    verified: true
    sql: |
      SELECT PARENT_ENTITY, COUNT(*) AS journal_lines,
             ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS share_pct
      FROM lakehouse_mvpai.silver.fact_fynapse_slr_journals
      GROUP BY PARENT_ENTITY
      ORDER BY journal_lines DESC

