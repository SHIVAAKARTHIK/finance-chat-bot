  - id: adra_pct_finalized
    question: What percentage of Cars USA Shipping accounts are finalized in Oct 26?
    tables: [silver.adra_account_facts, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {numbers: ["26.1"]}
    verified: false
    sql: |
      SELECT ROUND(100.0 * SUM(CASE WHEN lower(trim(f.IS_FINALIZED)) = 'true' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 1) AS pct_finalized,
             SUM(CASE WHEN lower(trim(f.IS_FINALIZED)) = 'true' THEN 1 ELSE 0 END) AS finalized,
             COUNT(*) AS total_accounts
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE lower(le.ENTITY_NAME) LIKE '%cars usa shipping%' AND trim(p.PERIOD_NAME) = 'Oct 26'

