# Verified question -> SQL examples, retrieved by similarity as few-shot examples for the SQL agent.
# Sources: reference/semantic_pages/*/verified_queries.md and reference/question_bank/ground_truth_adra_fynapse_v1.sql.
#
# verified: true  = SQL as run against Databricks (ground truth 2026-11-15).
# verified: false = rewritten for v3: the old entity-scope filters (internal LEGAL_ENTITY_KEY / ENGAGEMENT_KEY values
#                   from RBAC) were replaced by the filter the question asks for (entity code + period label through
#                   the dimension tables). Expected values are from the ground truth; re-run live before trusting.
# Never add hold-out questions here.
examples:
  # ================================================================ ADRA (recon)
  - id: adra_status_lookup
    question: What is the reconciliation status of account 103300 for 100-Northwind in Feb 25?
    tables: [silver.adra_account_facts, silver.adra_account_dimensions, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {text: "Approved (account 103300, WF - Corp Sweep)"}
    verified: false
    sql: |
      SELECT trim(a.ACCOUNT_NUMBER) AS account_number, trim(a.ACCOUNT_NAME) AS account_name,
             trim(f.ACCOUNT_STATUS) AS account_status
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_account_dimensions a
        ON f.ACCOUNT_KEY = a.ACCOUNT_KEY AND f.ENGAGEMENT_KEY = a.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = a.LEGAL_ENTITY_KEY
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE trim(le.ENTITY_CODE) = '100' AND trim(p.PERIOD_NAME) = 'Feb 25' AND trim(a.ACCOUNT_NUMBER) = '103300'

  - id: adra_finalized_flag
    question: Has account 103300 been finalized for 100-Northwind in Feb 25?
    tables: [silver.adra_account_facts, silver.adra_account_dimensions, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {text: "No, not finalized (status is Approved, IS_FINALIZED is False)"}
    verified: false
    notes: Status and finalized are independent; report both.
    sql: |
      SELECT trim(a.ACCOUNT_NUMBER) AS account_number, trim(f.ACCOUNT_STATUS) AS account_status,
             lower(trim(f.IS_FINALIZED)) = 'true' AS is_finalized
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_account_dimensions a
        ON f.ACCOUNT_KEY = a.ACCOUNT_KEY AND f.ENGAGEMENT_KEY = a.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = a.LEGAL_ENTITY_KEY
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE trim(le.ENTITY_CODE) = '100' AND trim(p.PERIOD_NAME) = 'Feb 25' AND trim(a.ACCOUNT_NUMBER) = '103300'

  - id: adra_pending_closure_count
    question: How many Northwind accounts are pending closure for Feb 2025?
    tables: [silver.adra_account_facts, silver.adra_legal_entity_dimensions, silver.adra_period_dimensions]
    expected: {numbers: ["38"], text: "38 accounts not finalized (2 of 40 finalized)"}
    verified: false
    sql: |
      SELECT SUM(CASE WHEN lower(trim(f.IS_FINALIZED)) = 'false' THEN 1 ELSE 0 END) AS not_finalized,
             SUM(CASE WHEN lower(trim(f.IS_FINALIZED)) = 'true' THEN 1 ELSE 0 END) AS finalized,
             COUNT(*) AS total_accounts
      FROM lakehouse_mvpai.silver.adra_account_facts f
      JOIN lakehouse_mvpai.silver.adra_legal_entity_dimensions le
        ON f.LEGAL_ENTITY_KEY = le.LEGAL_ENTITY_KEY AND f.ENGAGEMENT_KEY = le.ENGAGEMENT_KEY
      JOIN lakehouse_mvpai.silver.adra_period_dimensions p
        ON f.PERIOD_KEY = p.PERIOD_KEY AND f.ENGAGEMENT_KEY = p.ENGAGEMENT_KEY AND f.LEGAL_ENTITY_KEY = p.LEGAL_ENTITY_KEY
      WHERE trim(le.ENTITY_CODE) = '100' AND trim(p.PERIOD_NAME) = 'Feb 25'

